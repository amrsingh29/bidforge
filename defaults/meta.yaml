# How configuration layers combine. Not overridable.
#
# Collections take new keys (adding a stage or a role); anywhere else a key that isn't in the
# defaults is reported by `bid config check` as an unknown ID (usually a typo).
collections: [stages, roles, modes]
# Keys allowed on anything, even where they aren't in the defaults (the "turn off" action)
always_allowed: [enabled]
